<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Morrow &amp; Thyme home page preview</title>
  <desc id="desc">Illustrated preview of the restaurant home page with its warm dining room, seasonal menu, and olive-green palette.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7794d"/><stop offset="1" stop-color="#342d24"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0c77c" stop-opacity=".85"/><stop offset="1" stop-color="#f0c77c" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="960" height="520" rx="18" fill="#f3efe6"/>
  <rect x="0" y="0" width="960" height="25" rx="18" fill="#374733"/>
  <rect x="0" y="17" width="960" height="8" fill="#374733"/>
  <text x="480" y="17" text-anchor="middle" fill="#f3efe6" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">A GOOD TABLE IS WAITING FOR YOU</text>
  <text x="52" y="65" fill="#1d241d" font-family="Georgia,serif" font-size="27" letter-spacing="-2">morrow &amp; thyme</text>
  <text x="53" y="80" fill="#6d7267" font-family="Arial,sans-serif" font-size="7" letter-spacing="2">NEIGHBORHOOD KITCHEN · SINCE 2018</text>
  <g fill="#374733" font-family="Arial,sans-serif" font-size="10"><text x="600" y="67">Home</text><text x="655" y="67">Menu</text><text x="705" y="67">Our story</text><text x="780" y="67">Visit</text></g>
  <rect x="833" y="48" width="77" height="31" fill="#374733"/>
  <text x="871" y="67" text-anchor="middle" fill="#fffaf0" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">BOOK A TABLE</text>
  <path d="M0 94h960" stroke="#d7d0c3"/>
  <text x="62" y="150" fill="#c85f46" font-family="Arial,sans-serif" font-size="9" font-weight="bold" letter-spacing="2">GOOD FOOD. NO BIG OCCASION NEEDED.</text>
  <text x="58" y="219" fill="#1d241d" font-family="Georgia,serif" font-size="59" letter-spacing="-3">A little more</text>
  <text x="58" y="278" fill="#1d241d" font-family="Georgia,serif" font-size="59" letter-spacing="-3">room for <tspan fill="#c85f46" font-style="italic">joy.</tspan></text>
  <text x="62" y="319" fill="#6d7267" font-family="Arial,sans-serif" font-size="12">Season-led plates, wine poured generously, and long</text>
  <text x="62" y="339" fill="#6d7267" font-family="Arial,sans-serif" font-size="12">candlelit evenings that make you forget your phone.</text>
