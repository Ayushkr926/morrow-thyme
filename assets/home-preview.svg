  <text x="124" y="394" text-anchor="middle" fill="#fffaf0" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">COME HUNGRY</text>
  <text x="208" y="394" fill="#1d241d" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">TAKE A PEEK AT THE MENU →</text>
