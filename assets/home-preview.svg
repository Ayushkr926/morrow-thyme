  <text x="62" y="474" fill="#6d7267" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">A NEIGHBORHOOD FAVORITE, TABLE AFTER TABLE.</text>
  <text x="895" y="492" text-anchor="end" fill="#6d7267" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">MORROW &amp; THYME · BROOKLYN</text>
